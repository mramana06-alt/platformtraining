<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PL Guided Onboarding Prototype</title>
<style>
  :root {
    --ink: #25292c; --muted: #52675a; --line: #e3e8e4; --card-line: #dfe5e1; --green: #244f3b; --green-soft: #edf3ef;
    --eyebrow: #587463; --soft: #f6f7f7; --accent: #2e8b57; --warn-bg: #fff9e9; --warn-line: #e4c37e; --danger: #b42318;
    --blue: #2a78d6; --blue-soft: #eaf2fc; --hl: #f2b64a;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: var(--ink); font: 14px/1.5 Aptos, "Segoe UI Variable", "Segoe UI", -apple-system, sans-serif; }
  button, textarea, input { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .55; }
  .app-shell { display: flex; flex-direction: column; height: 100vh; }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: #fff; flex: 0 0 auto; }
  .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; color: #fff; background: var(--green); font: 700 .74rem Georgia, serif; letter-spacing: .08em; }
  .topbar h1 { margin: 0; font: 500 1.35rem/1 Georgia, "Times New Roman", serif; }
  .topbar .proto { margin-left: 8px; padding: 4px 10px; border-radius: 999px; background: var(--blue-soft); color: #1c5cab; font-size: .74rem; font-weight: 700; }
  .topbar .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 6px 14px; font-size: .82rem; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--green); color: #fff; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 7px 12px; font-size: .84rem; font-weight: 600; color: var(--ink); }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.primary:hover { background: #1d3f30; }
  .btn.ghost { border-color: transparent; }
  .btn.small { padding: 4px 9px; font-size: .78rem; }
  .btn.danger { color: var(--danger); }
  .workspace { display: grid; grid-template-columns: 236px minmax(0, 1fr) 372px; flex: 1 1 auto; min-height: 0; }
  /* sidebar */
  .project-sidebar { border-right: 1px solid var(--line); padding: 14px 12px; overflow: auto; background: #fbfcfb; }
  .eyebrow { margin: 0 0 6px; color: var(--eyebrow); font-size: .68rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
  .project { padding: 9px 10px; border-radius: 9px; margin-bottom: 4px; cursor: pointer; border: 1px solid transparent; }
  .project:hover { background: #f1f4f2; }
  .project.active { background: #fff; border-color: var(--card-line); box-shadow: 0 4px 14px rgba(37,54,46,.06); }
  .project .name { font-weight: 700; font-size: .86rem; }
  .project .sub { color: var(--muted); font-size: .74rem; }
  .project-empty { color: var(--muted); font-size: .82rem; padding: 8px 10px; }
  /* chat */
  .chat-column { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .conversation { flex: 1 1 auto; overflow-y: auto; padding: 24px clamp(24px, 4vw, 60px) 150px; }
  .message { position: relative; max-width: 100%; margin: 0 0 16px; padding: 14px 18px; border: 1px solid var(--card-line); border-radius: 13px; background: #fff; box-shadow: 0 8px 26px rgba(37,54,46,.05); font-size: .9rem; }
  .message--user { width: fit-content; max-width: 82%; margin-left: auto; padding: 10px 16px; color: #fff; border: 0; background: var(--green); box-shadow: none; }
  .message--system { background: #fbfcfb; }
  .message-actor { margin: 0 0 7px; color: var(--eyebrow); font-size: .64rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
  .message p { margin: 0 0 8px; }
  .message p:last-child { margin-bottom: 0; }
  .message h3 { margin: 10px 0 6px; font-size: 1rem; }
  .message ul, .message ol { margin: 4px 0 8px; padding-left: 20px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 6px 0 10px; font-size: .86rem; }
  .kv dt { color: var(--muted); font-weight: 600; } .kv dd { margin: 0; }
  table.tbl { border-collapse: collapse; width: 100%; font-size: .82rem; margin: 6px 0 10px; }
  .tbl th, .tbl td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tbl th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; }
  .tbl td.c { text-align: center; }
  .callout { border: 1px solid var(--line); border-left: 4px solid var(--blue); background: var(--blue-soft); border-radius: 8px; padding: 9px 12px; margin: 8px 0 10px; font-size: .86rem; }
  .callout.warning { border-left-color: var(--warn-line); background: var(--warn-bg); }
  .callout.success { border-left-color: var(--accent); background: var(--green-soft); }
  .callout.danger { border-left-color: var(--danger); background: #fff4f1; }
  .callout strong { display: block; margin-bottom: 2px; }
  pre.code { margin: 6px 0 10px; padding: 10px 12px; border-radius: 8px; background: #f4f6f5; border: 1px solid var(--line); font: 12px/1.45 ui-monospace, Consolas, monospace; overflow-x: auto; }
  .diff { margin: 6px 0 10px; font: 12.5px/1.5 ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .diff div { padding: 2px 10px; }
  .diff .add { background: #e9f7ec; color: #14532d; } .diff .del { background: #fdecec; color: #7f1d1d; } .diff .ctx { color: var(--muted); }
  figure.diagram { margin: 8px 0 12px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fcfdfc; overflow-x: auto; }
  figure.diagram figcaption { color: var(--muted); font-size: .76rem; margin-top: 4px; }
  figure.diagram svg { display: block; max-width: 100%; height: auto; }
  .understood { margin-top: 12px; padding-top: 8px; border-top: 1px dashed var(--line); color: var(--muted); font-size: .78rem; display: flex; gap: 14px; flex-wrap: wrap; }
  .understood b { color: var(--ink); }
  /* interaction cards */
  .interaction-card { border: 1px solid #cfe0d5; background: #f7faf8; border-radius: 12px; padding: 12px 14px; margin: 10px 0 0; }
  .interaction-card .q { font-weight: 700; margin-bottom: 8px; }
  .option-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
  .option-card { text-align: left; border: 1px solid var(--card-line); background: #fff; border-radius: 10px; padding: 9px 11px; font-size: .84rem; }
  .option-card:hover { border-color: var(--accent); background: var(--green-soft); }
  .option-card .rec { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--green); color: #fff; font-size: .64rem; font-weight: 700; vertical-align: 2px; }
  .option-card small { display: block; color: var(--muted); }
  .interaction-actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .own-answer { width: 100%; margin-top: 8px; }
  .own-answer textarea { width: 100%; min-height: 56px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .done-tag { display: inline-block; margin-top: 8px; padding: 3px 9px; border-radius: 999px; background: var(--green-soft); color: var(--green); font-size: .74rem; font-weight: 700; }
  /* welcome */
  .paths { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
  .path { text-align: left; border: 1px solid var(--card-line); border-radius: 12px; background: #fff; padding: 12px 14px; }
  .path:hover { border-color: var(--accent); background: var(--green-soft); }
  .path.default { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
  .path b { display: block; font-size: .92rem; }
  .path span { color: var(--muted); font-size: .8rem; }
  .starters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .starter { text-align: left; border: 1px solid var(--card-line); border-radius: 10px; background: #fff; padding: 9px 11px; font-size: .82rem; }
  .starter:hover { border-color: var(--accent); background: var(--green-soft); }
  .starter small { display: block; color: var(--muted); }
  .mini-journey { display: flex; gap: 4px; align-items: center; margin: 10px 0 4px; flex-wrap: wrap; }
  .mini-journey span { padding: 4px 9px; border-radius: 999px; background: var(--soft); font-size: .76rem; font-weight: 600; color: var(--muted); }
  .mini-journey i { color: #b8c2bc; font-style: normal; }
  /* composer */
  .composer { position: absolute; right: 0; bottom: 0; left: 0; padding: 0 clamp(24px, 4vw, 60px) 12px; pointer-events: none; background: linear-gradient(to top, #fff 60%, rgba(255,255,255,0)); }
  .composer-row { max-width: 900px; margin: 0 auto; padding: 10px 10px 8px; border: 1px solid #e6e9ee; border-radius: 22px; background: #fff; box-shadow: 0 8px 24px rgba(15,30,54,.06); pointer-events: auto; }
  .composer-row textarea { display: block; width: 100%; min-height: 44px; max-height: 160px; padding: 6px 4px; border: 0; background: transparent; resize: none; outline: 0; }
  .composer-footer { display: flex; align-items: center; gap: 8px; }
  .next-step { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .next-step button { border: 1px solid #cfe0d5; background: var(--green-soft); color: var(--green); border-radius: 999px; padding: 4px 10px; font-size: .76rem; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .next-step .hint { color: var(--muted); font-size: .74rem; white-space: nowrap; }
  .send { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--green); color: #fff; font-size: 1rem; }
  .composer.disabled .composer-row { background: #f7f8f7; }
  /* side panel */
  .side-panel { border-left: 1px solid var(--line); overflow: auto; background: #fbfcfb; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .panel { border: 1px solid var(--card-line); border-radius: 10px; background: #fff; padding: 10px 12px; }
  .panel h2 { margin: 0 0 8px; font-size: .84rem; display: flex; align-items: center; gap: 8px; }
  .panel h2 .btn { margin-left: auto; }
  .journey { display: flex; flex-direction: column; gap: 4px; }
  .jstep { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 8px; font-size: .8rem; }
  .jstep .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #b8c2bc; background: #fff; flex: 0 0 auto; }
  .jstep.done .dot { background: var(--accent); border-color: var(--accent); }
  .jstep.active { background: var(--green-soft); font-weight: 700; }
  .jstep.active .dot { border-color: var(--green); background: var(--green); box-shadow: 0 0 0 3px #cfe0d5; }
  .jstep small { color: var(--muted); font-weight: 400; margin-left: auto; }
  .jstep .why { display: none; width: 100%; color: var(--muted); font-size: .74rem; font-weight: 400; padding-left: 18px; }
  .jstep.open { flex-wrap: wrap; } .jstep.open .why { display: block; }
  .breadcrumb { display: flex; gap: 4px; flex-wrap: wrap; font-size: .76rem; }
  .breadcrumb span { padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); }
  .breadcrumb span.done { background: var(--green-soft); color: var(--green); }
  .breadcrumb span.active { background: var(--green); color: #fff; }
  .tabs { display: flex; gap: 2px; flex-wrap: wrap; margin-bottom: 8px; }
  .tabs button { border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 4px 8px; font-size: .74rem; font-weight: 600; color: var(--muted); }
  .tabs button.on { background: var(--soft); color: var(--ink); border-color: var(--line); }
  .tabs button b { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: #e6ebe8; font-size: .68rem; text-align: center; }
  .view { font-size: .8rem; }
  .view .row { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .view .row:last-child { border-bottom: 0; }
  .view .row .k { color: var(--muted); font-weight: 600; }
  .view .item { padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .view .item:last-child { border-bottom: 0; }
  .view .item small { color: var(--muted); display: block; }
  .view .empty { color: var(--muted); font-style: italic; padding: 4px 0; }
  .st { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: .68rem; font-weight: 700; margin-right: 6px; }
  .st.open { background: #fdecec; color: #7f1d1d; } .st.covered { background: #e9f7ec; color: #14532d; } .st.deferred { background: var(--soft); color: var(--muted); }
  .st.assumed { background: var(--warn-bg); color: #7a5a10; } .st.confirmed { background: #e9f7ec; color: #14532d; } .st.corrected { background: var(--blue-soft); color: #1c5cab; }
  .st.default { background: var(--soft); color: var(--muted); } .st.user { background: var(--green-soft); color: var(--green); }
  /* highlight ring (replay) */
  .hl { box-shadow: 0 0 0 3px var(--hl), 0 0 0 7px rgba(242,182,74,.35) !important; transition: box-shadow .2s; position: relative; z-index: 2; }
  .replay-bar { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 40; display: none; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 999px; background: #1f2a25; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.25); font-size: .8rem; }
  .replay-bar.on { display: flex; }
  .replay-bar button { border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff; border-radius: 999px; padding: 3px 10px; font-size: .76rem; }
  .replay-bar .caption { max-width: 420px; }
  .typing { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #b8c2bc; margin-right: 4px; animation: blink 1s infinite; }
  @keyframes blink { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
  /* progress */
  .steps { list-style: none; padding: 0; margin: 6px 0 8px; }
  .steps li { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: .84rem; }
  .steps li .dot { width: 9px; height: 9px; border-radius: 50%; background: #d3dad6; }
  .steps li.run .dot { background: var(--hl); } .steps li.ok .dot { background: var(--accent); }
  .steps li small { margin-left: auto; color: var(--muted); }
  /* modal + palette */
  .overlay { position: fixed; inset: 0; background: rgba(20,30,25,.45); display: none; z-index: 50; align-items: center; justify-content: center; }
  .overlay.on { display: flex; }
  .modal { width: min(880px, 94vw); max-height: 90vh; overflow: auto; background: #fff; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .modal header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .modal header .brand-mark { background: #1c5cab; }
  .modal header .who { margin-left: auto; color: var(--muted); font-size: .78rem; }
  .eal-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .eal-chat { padding: 14px; border-right: 1px solid var(--line); min-height: 320px; display: flex; flex-direction: column; gap: 8px; }
  .eal-msg { padding: 8px 12px; border-radius: 10px; background: var(--soft); font-size: .84rem; max-width: 92%; }
  .eal-msg.user { background: #1c5cab; color: #fff; margin-left: auto; }
  .eal-form { padding: 14px; }
  .eal-form label { display: block; font-size: .76rem; color: var(--muted); font-weight: 600; margin-top: 8px; }
  .eal-form input, .eal-form select { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; }
  .eal-form .sample { font-size: .72rem; color: #1c5cab; }
  .palette { width: min(640px, 92vw); background: #fff; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.3); overflow: hidden; }
  .palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; outline: 0; }
  .palette ul { list-style: none; margin: 0; padding: 6px; max-height: 360px; overflow: auto; }
  .palette li { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: .84rem; }
  .palette li:hover, .palette li.on { background: var(--green-soft); }
  .palette li small { display: block; color: var(--muted); }
  .kbd { display: inline-block; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; font-size: .7rem; color: var(--muted); }
  @media (max-width: 1100px) { .workspace { grid-template-columns: 200px minmax(0,1fr) 320px; } .paths, .starters { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 860px) { .workspace { grid-template-columns: minmax(0,1fr); } .project-sidebar, .side-panel { display: none; } }
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand-mark">PL</div>
    <h1>Platform Loops</h1>
    <span class="proto">Prototype · guided onboarding v1</span>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="User journey">
      <button id="modeNew" class="on" data-mode="new">New user</button>
      <button id="modeExisting" data-mode="existing">Existing user</button>
    </div>
    <button class="btn" id="paletteBtn" title="Ctrl+K">Commands <span class="kbd">Ctrl K</span></button>
    <button class="btn" id="resetBtn">Reset</button>
  </header>
  <div class="workspace">
    <aside class="project-sidebar" id="sidebar"></aside>
    <section class="chat-column">
      <div class="conversation" id="conversation" aria-live="polite"></div>
      <form class="composer" id="composer">
        <div class="composer-row">
          <label for="message">Message</label>
          <textarea id="message" rows="1" placeholder="Describe a problem or pick an example"></textarea>
          <div class="composer-footer">
            <div class="next-step" id="nextStep"></div>
            <button class="send" type="submit" id="sendBtn" aria-label="Send">➤</button>
          </div>
        </div>
      </form>
    </section>
    <aside class="side-panel">
      <section class="panel" id="journeyPanel"></section>
      <section class="panel" id="understandingPanel"></section>
    </aside>
  </div>
</div>
<div class="replay-bar" id="replayBar">
  <span class="caption" id="replayCaption">Replaying delivery journal · no model calls</span>
  <button id="replayPause">Pause</button>
  <button id="replaySpeed">1×</button>
  <button id="replaySkip">Skip to end</button>
  <button id="replayExit">Exit</button>
</div>
<div class="overlay" id="ealOverlay"><div class="modal" id="ealModal"></div></div>
<div class="overlay" id="paletteOverlay"><div class="palette" id="palette"><input id="paletteInput" placeholder="Type a command…"><ul id="paletteList"></ul></div></div>

<script>
/* =========================================================================
   PL guided onboarding prototype — vanilla JS, no dependencies.
   Two journeys: new user (assisted / replay) and existing user (expert).
   Everything rendered from state; typed blocks mirror ResponsePresentation.
   ========================================================================= */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---------- state ---------- */
const JOURNEY = [
  { id: "idea", label: "Idea", why: "Say the problem in your own words. The platform proposes shape, actors and a first process flow." },
  { id: "discovery", label: "Discovery", why: "One dimension per turn, led by measurable defaults you accept or correct. Ends in a Discovery Blueprint." },
  { id: "requirements", label: "Requirements", why: "Testable statements every later artifact traces to. Approving starts the plan → design → build-plan chain." },
  { id: "design", label: "Design & Plan", why: "Delivery Plan, Solution Design and Build Plan, each shown as consequence and diff, not as a document." },
  { id: "build", label: "Build", why: "Scaffold, generate, migrate, build, start, verify, review. You only hear from it when it needs you." },
  { id: "run", label: "Run in EAL", why: "Business Review, release identity, then open the app in the runtime with a test identity and sample data." },
];
const S = {
  mode: "new",
  app: "Equipment Checkout",
  goal: "",
  journey: Object.fromEntries(JOURNEY.map((j) => [j.id, "todo"])),
  current: [], decisions: [], assumptions: [], gaps: [], trace: [],
  view: "current", replay: null, palette: [], projects: [], activeProject: null,
};
const DIMS = ["Goal", "Actors and roles", "Current state", "Process", "Data and rules", "Who sees what", "UI shape", "Integrations", "Deployment target"];

function resetPanelState() {
  S.journey = Object.fromEntries(JOURNEY.map((j) => [j.id, "todo"]));
  S.current = []; S.decisions = []; S.assumptions = []; S.trace = [];
  S.gaps = DIMS.map((d) => ({ dim: d, state: "open", note: "" }));
}
function setJourney(id, state) { S.journey[id] = state; JOURNEY.forEach((j) => { if (state === "active" && j.id !== id && S.journey[j.id] === "active") S.journey[j.id] = "done"; }); renderJourney(); }
function cover(dim, note = "") { const g = S.gaps.find((x) => x.dim === dim); if (g) { g.state = "covered"; g.note = note; } renderUnderstanding(); }
function defer(dim, note = "") { const g = S.gaps.find((x) => x.dim === dim); if (g) { g.state = "deferred"; g.note = note; } renderUnderstanding(); }
function decide(what, source, detail = "") { S.decisions.unshift({ what, source, detail, when: stamp() }); renderUnderstanding(); }
function assume(text, status = "assumed") { S.assumptions.push({ text, status }); renderUnderstanding(); }
function setAssumption(idx, status, text) { if (S.assumptions[idx]) { S.assumptions[idx].status = status; if (text) S.assumptions[idx].text = text; } renderUnderstanding(); }
function setCurrent(rows) { S.current = rows; renderUnderstanding(); }
function traceItem(item, from) { S.trace.unshift({ item, from, when: stamp() }); renderUnderstanding(); }
function stamp() { return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }

/* ---------- diagrams (inline SVG) ---------- */
const SVG = {
  flow(steps, opts = {}) {
    const w = 132, h = 44, gap = 34, W = steps.length * w + (steps.length - 1) * gap + 8, H = 60;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(opts.label || "Process flow")}"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a9a90"/></marker></defs>`;
    steps.forEach((st, i) => {
      const x = 4 + i * (w + gap), y = 8; const active = opts.active === i;
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" fill="${active ? "#244f3b" : "#fff"}" stroke="${active ? "#244f3b" : "#9fb3a7"}" stroke-width="1.5"/>`;
      s += `<text x="${x + w / 2}" y="${y + h / 2 + 4}" text-anchor="middle" font-size="12" font-weight="600" fill="${active ? "#fff" : "#25292c"}">${esc(st)}</text>`;
      if (i < steps.length - 1) s += `<line x1="${x + w + 2}" y1="${y + h / 2}" x2="${x + w + gap - 3}" y2="${y + h / 2}" stroke="#8a9a90" stroke-width="1.5" marker-end="url(#ar)"/>`;
    });
    return s + `</svg>`;
  },
  swimlane(lanes, seq) {
    const laneH = 58, colW = 150, left = 118, cols = seq.length, W = left + cols * colW + 10, H = lanes.length * laneH + 8;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Swimlane"><defs><marker id="ar2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a9a90"/></marker></defs>`;
    lanes.forEach((l, i) => { const y = 4 + i * laneH; s += `<rect x="2" y="${y}" width="${W - 4}" height="${laneH - 4}" rx="8" fill="${i % 2 ? "#fbfcfb" : "#f3f6f4"}" stroke="#e3e8e4"/><text x="12" y="${y + laneH / 2 + 4}" font-size="12" font-weight="700" fill="#52675a">${esc(l)}</text>`; });
    const pos = seq.map((st, i) => ({ x: left + i * colW + 12, y: 4 + st.lane * laneH + 9, w: colW - 24, h: laneH - 22 }));
    seq.forEach((st, i) => { const p = pos[i]; s += `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="8" fill="#fff" stroke="#9fb3a7" stroke-width="1.4"/><text x="${p.x + p.w / 2}" y="${p.y + p.h / 2 + 4}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#25292c">${esc(st.label)}</text>`;
      if (i < seq.length - 1) { const q = pos[i + 1]; s += `<path d="M${p.x + p.w},${p.y + p.h / 2} C${p.x + p.w + 14},${p.y + p.h / 2} ${q.x - 14},${q.y + q.h / 2} ${q.x - 2},${q.y + q.h / 2}" fill="none" stroke="#8a9a90" stroke-width="1.4" marker-end="url(#ar2)"/>`; } });
    return s + `</svg>`;
  },
  components(app, api, schema, port) {
    const W = 640, H = 210;
    const box = (x, y, w, h, t, sub, fill = "#fff", stroke = "#9fb3a7") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/><text x="${x + w / 2}" y="${y + 24}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#25292c">${esc(t)}</text><text x="${x + w / 2}" y="${y + 42}" text-anchor="middle" font-size="11" fill="#52675a">${esc(sub)}</text>`;
    const ar = (x1, y1, x2, y2, label) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#8a9a90" stroke-width="1.5" marker-end="url(#ar3)"/>` + (label ? `<text x="${(x1 + x2) / 2}" y="${(y1 + y2) / 2 - 6}" text-anchor="middle" font-size="10.5" fill="#52675a">${esc(label)}</text>` : "");

      ${box(20, 20, 150, 56, "EAL runtime", "chat + full view", "#eaf2fc", "#7fa6d9")}
      ${box(245, 20, 150, 56, app + " UI", "React · worklist + form")}

    </svg>`;

      fields.forEach((f, i) => { const y = 40 + i * 28; s += `<text x="14" y="${y + 8}" font-size="10" fill="#52675a">${f}</text><rect x="100" y="${y - 4}" width="180" height="18" rx="5" fill="#f6f7f7" stroke="#e3e8e4"/>`; });
      return s + `<rect x="200" y="182" width="80" height="20" rx="6" fill="#244f3b"/><text x="240" y="196" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">Create</text></svg>`;
    }
    let s = `<svg viewBox="0 0 320 210" width="320" height="210" role="img" aria-label="Worklist wireframe"><rect x="1" y="1" width="318" height="208" rx="10" fill="#fff" stroke="#9fb3a7"/><text x="14" y="24" font-size="12" font-weight="700" fill="#25292c">${esc(title)}</text><rect x="228" y="10" width="80" height="20" rx="6" fill="#244f3b"/><text x="268" y="24" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">New checkout</text><rect x="14" y="40" width="200" height="16" rx="5" fill="#f6f7f7" stroke="#e3e8e4"/><text x="20" y="52" font-size="9" fill="#8a9a90">Search · filter: status, depot</text>`;
    ["Asset", "Item", "Requester", "Due", "Status"].forEach((h, i) => { s += `<text x="${14 + i * 60}" y="76" font-size="9.5" font-weight="700" fill="#52675a">${h}</text>`; });
    for (let r = 0; r < 5; r++) { const y = 88 + r * 22; s += `<line x1="14" y1="${y + 12}" x2="306" y2="${y + 12}" stroke="#e3e8e4"/>`; [52, 44, 48, 34, 40].forEach((w, i) => { s += `<rect x="${14 + i * 60}" y="${y}" width="${w}" height="8" rx="3" fill="${i === 4 ? (r % 3 === 0 ? "#e4c37e" : "#cfe0d5") : "#e6ebe8"}"/>`; }); }
    return s + `</svg>`;
  },
  topology(schema, uiPort, apiPort) {
    return SVG.flow([`UI :${uiPort}`, `API :${apiPort}`, `PostgreSQL · ${schema}`], { label: "Local topology" });
  },
};

/* ---------- typed blocks ---------- */
function renderBlocks(blocks) {
  const frag = document.createDocumentFragment();
  for (const b of blocks) {
    let n;
    switch (b.type) {
      case "paragraph": n = el("p", "", b.html || esc(b.text)); break;
      case "heading": n = el("h3", "", esc(b.text)); break;
      case "bullet_list": n = el("ul"); b.items.forEach((i) => n.appendChild(el("li", "", i.html || esc(i)))); break;
      case "numbered_list": n = el("ol"); b.items.forEach((i) => n.appendChild(el("li", "", i.html || esc(i)))); break;
      case "key_value": n = el("dl", "kv"); b.rows.forEach(([k, v]) => { n.appendChild(el("dt", "", esc(k))); n.appendChild(el("dd", "", v.html || esc(v))); }); break;
      case "table": n = el("table", "tbl"); n.innerHTML = `<thead><tr>${b.columns.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${b.rows.map((r) => `<tr>${r.map((c) => `<td class="${c === "✓" || c === "—" ? "c" : ""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody>`; break;
      case "callout": n = el("div", "callout " + (b.tone || ""), (b.title ? `<strong>${esc(b.title)}</strong>` : "") + (b.html || esc(b.text))); break;
      case "code": n = el("pre", "code", esc(b.text)); break;
      case "diagram": n = el("figure", "diagram", b.svg + (b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : "")); break;
      case "diff": n = el("div", "diff", (b.context ? `<div class="ctx">${esc(b.context)}</div>` : "") + (b.removed || []).map((l) => `<div class="del">− ${esc(l)}</div>`).join("") + (b.added || []).map((l) => `<div class="add">+ ${esc(l)}</div>`).join("")); break;
      default: n = el("p", "", esc(JSON.stringify(b)));
    }
    frag.appendChild(n);
  }
  return frag;
}

const composer = $("#composer"), ta = $("#message"), nextStepBox = $("#nextStep");
let pending = null; // pending interaction
function setPlaceholder(t) { ta.placeholder = t; }
function setNextStep(cmd, hint) {
  nextStepBox.innerHTML = "";
  if (!cmd) return;
  const b = el("button", "", esc(cmd)); b.type = "button"; b.dataset.next = "1"; b.title = cmd;
  b.onclick = () => { ta.value = cmd; composer.requestSubmit(); };
  nextStepBox.appendChild(b); if (hint) nextStepBox.appendChild(el("span", "hint", esc(hint)));
}

/* Ask one question with option cards + free-text answer. Resolves with {label, own} */
function ask(host, q) {
  return new Promise((resolve) => {
    const card = el("div", "interaction-card");
    card.innerHTML = `<div class="q">${esc(q.prompt)}</div>`;
    const grid = el("div", "option-grid");
    q.options.forEach((o, i) => {
      const b = el("button", "option-card", `${esc(o.label)}${o.recommended ? '<span class="rec">Recommended</span>' : ""}${o.detail ? `<small>${esc(o.detail)}</small>` : ""}`);
      b.type = "button"; b.dataset.opt = String(i); if (o.recommended) b.dataset.rec = "1";
      b.onclick = () => finish({ label: o.label, index: i });
      grid.appendChild(b);
    });
    card.appendChild(grid);
    const acts = el("div", "interaction-actions");
    const own = el("button", "btn small", "Answer in your own words"); own.type = "button";
    acts.appendChild(own); card.appendChild(acts);
    const ownBox = el("div", "own-answer"); ownBox.style.display = "none";
    ownBox.innerHTML = `<textarea placeholder="Or answer in your own words"></textarea><div class="interaction-actions"><button type="button" class="btn primary small" data-own-send>Answer</button></div>`;
    card.appendChild(ownBox);
    own.onclick = () => { ownBox.style.display = ownBox.style.display === "none" ? "block" : "none"; ownBox.querySelector("textarea").focus(); };
    ownBox.querySelector("[data-own-send]").onclick = () => { const t = ownBox.querySelector("textarea").value.trim(); if (t) finish({ label: t, own: true }); };
    host.appendChild(card); lockComposer(true); pending = card; scrollDown();
    function finish(a) { card.querySelectorAll("button, textarea").forEach((x) => (x.disabled = true)); card.appendChild(el("div", "done-tag", "Answered")); lockComposer(false); pending = null; addUser(a.label); resolve(a); }
  });
}
/* Buttons in a card: resolves with the clicked key */
function choose(host, buttons) {
  return new Promise((resolve) => {
    const acts = el("div", "actions");
    buttons.forEach((b) => { const x = el("button", "btn " + (b.primary ? "primary" : "") + (b.danger ? " danger" : ""), esc(b.label)); x.type = "button"; x.dataset.act = b.key; x.onclick = () => { acts.querySelectorAll("button").forEach((y) => (y.disabled = true)); x.classList.add("primary"); resolve(b.key); }; acts.appendChild(x); });
    host.appendChild(acts); scrollDown();
  });
}

  p.innerHTML = `<h2>Understanding</h2><div class="tabs">${tabs.map(([k, l]) => `<button data-view="${k}" class="${S.view === k ? "on" : ""}">${l}<b>${counts[k]}</b></button>`).join("")}</div><div class="view" id="viewBody"></div>`;

  if (S.view === "decisions") v.innerHTML = S.decisions.length ? S.decisions.map((d) => `<div class="item"><span class="st ${d.source === "you" ? "user" : "default"}">${d.source === "you" ? "you" : "platform default"}</span>${esc(d.what)}<small>${esc(d.detail)} · ${d.when}</small></div>`).join("") : `<div class="empty">No decisions yet. Accepted defaults and approvals land here.</div>`;

  if (S.view === "gaps") v.innerHTML = S.gaps.map((g) => `<div class="item"><span class="st ${g.state}">${g.state === "covered" ? "covered" : g.state === "deferred" ? "deferred" : "open"}</span>${esc(g.dim)}${g.note ? `<small>${esc(g.note)}</small>` : ""}</div>`).join("");
  if (S.view === "trace") v.innerHTML = S.trace.length ? S.trace.map((t) => `<div class="item">${esc(t.item)}<small>from ${esc(t.from)} · ${t.when}</small></div>`).join("") : `<div class="empty">Every requirement, decision and file will point back to the message or artifact it came from.</div>`;
}

/* ---------- Stage 1: idea → outcome ---------- */
async function startIdea(text) {
  if (!S.projects.length) { S.projects = [{ id: "p1", name: S.app, sub: "created just now · Local Development" }]; S.activeProject = "p1"; renderSidebar(); }
  S.goal = text; addUser(text);
  document.querySelector(".message--system .paths")?.closest(".message")?.querySelectorAll("button").forEach((b) => (b.disabled = true));
  setJourney("idea", "active");
  await thinking(900);
  const m = addPlatform([
    { type: "paragraph", html: `You want to <strong>${esc(text.replace(/\.$/, ""))}</strong> so people always know what is out, who has it and when it is due back. Here is how I would shape it before we go any deeper.` },
    { type: "key_value", rows: [["Likely shape", "Worklist + business form (two of the nine floorplans)"], ["Actors", "Requester · Depot staff · Depot manager"], ["Core object", "Equipment checkout (one record per loan)"], ["Main journey", "Request → Approve → Check out → Return → Close"]] },
    { type: "diagram", svg: SVG.flow(["Request", "Approve", "Check out", "Return", "Close"]), caption: "Proposed process. Every box becomes a status your users can see." },
    { type: "heading", text: "What I am assuming so we can move fast" },
    { type: "numbered_list", items: ["Each depot keeps its own equipment list, and one asset can be out on only one checkout at a time.", "Loans have a due date and can go overdue.", "Depot managers approve; requesters see only their own checkouts."] },
    { type: "callout", tone: "", title: "You do not need to answer everything now.", text: "I will ask one question per turn, always with a recommended default. Correct anything in the panel on the right at any time." },
  ], { understood: ["goal, actors, shape, main journey", "3 (see panel)", "6 dimensions"] });
  setCurrent([["Goal", text], ["Shape", "Worklist + business form"], ["Actors", "Requester, Depot staff, Depot manager"], ["Core object", "Equipment checkout"], ["Process", "Request → Approve → Check out → Return → Close"]]);
  assume("One asset can be out on only one checkout at a time."); assume("Loans have a due date and can go overdue."); assume("Depot managers approve; requesters see only their own.");
  cover("Goal"); cover("Process", "proposed, not yet confirmed"); traceItem("Goal, actors, process proposal", "your first message");
  setJourney("discovery", "active");
  const a = await ask(m, { prompt: "Who approves a checkout?", options: [{ label: "Depot manager approves each request", recommended: true, detail: "Keeps assets accountable per depot" }, { label: "No approval; depot staff check out directly", detail: "Faster, less control" }, { label: "Approval only above a value threshold", detail: "Needs an asset value field" }] });

async function reviewRequirementsV2() {
  addUser("Review Requirements v2"); await thinking(500);
  const m = addPlatform([
    { type: "heading", text: "Requirements v2 · " + EXISTING.project },
    { type: "paragraph", html: "<strong>What this decides:</strong> the rounding rule becomes a testable requirement and a validation rule in the API." },
    { type: "diff", context: "vs Requirements v1 (approved)", removed: ["R-07 Reimbursement amount is computed from miles and rate"], added: ["R-07 Reimbursement amount = miles × rate, rounded to 2 decimals half-up; displayed with 2 decimals", "V-04 Validation: rate must be positive; miles ≥ 0.1"] },
  ]);

  if (k !== "approve") { decide("Requirements v2 change requested", "you"); return addPlatform([{ type: "paragraph", text: "Recorded as a rejection effect. Tell me the wording and I will draft v3." }]); }
  const n = addPlatform([{ type: "callout", tone: "warning", title: "Approval cascade", text: "Approving Requirements v2 supersedes Delivery Plan v1, Solution Design v1 and Build Plan v1. They must be regenerated in that order before Start build is eligible." }], { cls: "message--assistant" });
  const c = await choose(n, [{ key: "go", label: "Approve and regenerate in order", primary: true }, { key: "cancel", label: "Cancel" }]);
  if (c !== "go") return;
  decide("Requirements v2 approved", "you", "supersedes DP/SD/BP v1"); setJourney("design", "active"); setCurrent(S.current.map(([k, v]) => k === "Requirements" ? [k, "v2 approved"] : k.startsWith("Delivery Plan") ? [k, "superseded; regenerating"] : [k, v]));
  await thinking(500);
  const o = addPlatform([{ type: "heading", text: "Expert override available" }, { type: "paragraph", text: "You reviewed v1 of all three downstream work products. I can regenerate them from Requirements v2 and show one combined diff instead of three reviews." }]);
  const b = await choose(o, [{ key: "batch", label: "Regenerate all three, one combined diff", primary: true }, { key: "one", label: "One at a time" }]);
  if (b === "one") { for (const key of ["delivery-plan", "solution-design", "build-plan"]) { await workProduct(key); await wait(200); } }
  else {
    await thinking(1200);
    const d = addPlatform([{ type: "heading", text: "Delivery Plan v2 · Solution Design v2 · Build Plan v2" }, { type: "diff", context: "combined, vs the v1 you approved", added: ["Solution Design: rounding in domain layer (shared/domain.ts), not in UI", "Build Plan: +1 migration 0002 (additive: rate precision), +2 tests (rounding half-up, negative rate rejected)"], removed: ["Build Plan: test 'amount computed' replaced by two exact-value tests"] }, { type: "callout", tone: "", text: "Everything else is byte-identical to v1. Stage applicability unchanged." }]);
    const k2 = await choose(d, [{ key: "approve", label: "Approve all three", primary: true }, { key: "one", label: "Review individually" }]);
    if (k2 === "one") { for (const key of ["delivery-plan", "solution-design", "build-plan"]) { await workProduct(key); } }
    else { ["Delivery Plan v2", "Solution Design v2", "Build Plan v2"].forEach((w) => decide(w + " approved", "you", "batch approval after review of v1")); }

}

async function existingCommand(text) {
  const t = text.toLowerCase();

}

/* ---------- command palette ---------- */
const palOverlay = $("#paletteOverlay"), palInput = $("#paletteInput"), palList = $("#paletteList");
function openPalette() {
  const items = S.mode === "existing" ? EXISTING.commands : [["Start with my idea", "describe a problem in the composer", "focus"], ["Watch a 3-minute build", "replay a real delivery, no model calls", "watch"], ["I know the platform", "switch to the expert experience", "know"], ...STARTERS.map(([t, s]) => [t, "starter · " + s, "starter"])];
  palList.innerHTML = ""; items.forEach(([label, sub, kind], i) => { const li = el("li", i === 0 ? "on" : "", `${esc(label)}<small>${esc(sub)}</small>`); li.onclick = () => runPalette(label, kind); palList.appendChild(li); });
  palOverlay.classList.add("on"); palInput.value = ""; palInput.focus();
}
function runPalette(label, kind) {
  palOverlay.classList.remove("on");
  if (kind === "focus") return ta.focus();
  if (kind === "watch") return runReplay();
  if (kind === "know") return setMode("existing");
  if (kind === "starter") return startIdea(label);
  ta.value = label; composer.requestSubmit();
}
palInput.addEventListener("input", () => { const q = palInput.value.toLowerCase(); [...palList.children].forEach((li) => (li.style.display = li.textContent.toLowerCase().includes(q) ? "" : "none")); });
palInput.addEventListener("keydown", (e) => { const vis = [...palList.children].filter((li) => li.style.display !== "none"); let i = vis.findIndex((li) => li.classList.contains("on")); if (e.key === "ArrowDown") { i = Math.min(vis.length - 1, i + 1); } else if (e.key === "ArrowUp") { i = Math.max(0, i - 1); } else if (e.key === "Enter") { e.preventDefault(); return (vis[i] || vis[0])?.click(); } else if (e.key === "Escape") { return palOverlay.classList.remove("on"); } else return; vis.forEach((li) => li.classList.remove("on")); vis[i]?.classList.add("on"); });
palOverlay.addEventListener("click", (e) => { if (e.target === palOverlay) palOverlay.classList.remove("on"); });
$("#ealOverlay").addEventListener("click", (e) => { if (e.target === $("#ealOverlay")) $("#ealOverlay").classList.remove("on"); });
document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); } });
$("#paletteBtn").onclick = openPalette;

  if (mode === "new") { S.projects = []; S.activeProject = null; renderSidebar(); S.journeyOpen = true; renderJourney(); renderUnderstanding(); renderBlank(); }
  else renderExisting();
}

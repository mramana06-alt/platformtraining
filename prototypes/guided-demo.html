<html lang="en">
<head>

<title>PL Studio · Build your first app</title>
<style>
:root{font:14px/1.6 'Segoe UI',system-ui,sans-serif;color:#182b45;background:#f3f6fb;--blue:#245de8;--line:#dce4ef;--muted:#62738b}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #edac31;outline-offset:3px}.shell{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr)}aside{background:#11223b;color:#d4def0;padding:26px 20px;display:flex;flex-direction:column;gap:26px}.brand{display:flex;align-items:center;gap:10px;color:#fff;font-size:20px;font-weight:650}.mark{background:#386ef2;border-radius:10px;display:grid;place-items:center;width:38px;height:38px;font-size:17px}.eyebrow{text-transform:uppercase;font-size:11px;font-weight:650;letter-spacing:1.6px;color:var(--muted)}aside .eyebrow{color:#97acc8}.journey{list-style:none;margin:10px 0;padding:0}.journey li{padding:12px 8px;display:flex;gap:11px;border-radius:8px;color:#9db0cd}.journey li.active{background:#234574;color:#fff}.journey li.done{color:#b8e6d7}.num{width:24px;height:24px;flex:none;display:grid;place-items:center;border:1px solid #516886;border-radius:50%;font-size:12px}.journey small{display:block;font-size:11px;color:inherit;opacity:.8}.sidefoot{margin-top:auto;border-top:1px solid #344863;padding-top:18px;font-size:12px;color:#a9bad1}.sidefoot strong{color:#edf3ff;display:block}.stage-logo{font-size:12px;border:1px solid #54718c;border-radius:5px;padding:4px 7px;display:inline-block;margin-bottom:10px}.main{min-width:0}header{height:84px;background:#fff;border-bottom:1px solid var(--line);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:16px}header p{margin:0;color:var(--muted);font-size:12px}.toolbar{display:flex;align-items:center;gap:10px}.badge{display:inline-block;border-radius:30px;background:#eaf0fe;color:#2451af;padding:5px 10px;font-size:11px;font-weight:600}.badge.green{background:#e3f5ed;color:#166949}.prototype{background:#fff6e0;border-bottom:1px solid #eee0b9;padding:8px 32px;font-size:12px;color:#705620}.layout{padding:28px 32px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;max-width:1480px;margin:auto}.workspace{min-width:0}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:24px}.stagehead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}.stagehead h1{font-size:26px;line-height:1.25;letter-spacing:-.6px;margin:5px 0}.muted{color:var(--muted)}h2{font-size:20px;line-height:1.3;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}p{margin:8px 0 15px}.hero{padding:30px 6px 10px}.hero h1{font-size:40px;max-width:580px;line-height:1.14;letter-spacing:-1.4px;margin:12px 0 18px}.hero p{max-width:580px;font-size:16px;color:var(--muted)}.hero .icon{font-size:25px;border-radius:14px;background:#ecf2ff;width:56px;height:56px;display:grid;place-items:center}.btn{border:1px solid #cad6e6;background:#fff;color:#263e60;padding:10px 15px;border-radius:8px;font-weight:600}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.small{font-size:12px;padding:7px 10px}.btn.text{border:0;background:transparent;color:var(--muted)}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}.highlight{box-shadow:0 0 0 4px #245de81c;outline:2px solid #638aff;outline-offset:4px;animation:glow 2s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 0 0 9px #245de80c}}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:24px}.mini{background:#f5f8fd;border:1px solid #e5ebf3;border-radius:10px;padding:16px}.mini .symbol{font-size:20px;margin-bottom:8px}.mini p{font-size:12px;margin:0}.coach{align-self:start;position:sticky;top:20px}.coach .panel{padding:20px}.coach-label{font-size:11px;font-weight:700;color:#245de8;letter-spacing:1.2px;text-transform:uppercase}.coach h2{margin-top:10px;font-size:18px}.coach p{font-size:13px}.coach details{border-top:1px solid var(--line);padding-top:12px;margin-top:16px}.coach summary{cursor:pointer;color:#355b93;font-size:12px;font-weight:600}.ledger{margin-top:16px}.ledger dl{margin:0}.ledger dt{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:14px}.ledger dd{margin:4px 0;font-size:12px}.bubble{background:#eef4ff;border-radius:10px;padding:15px;margin:14px 0}.assistant-message{border-left:3px solid #3273ee;padding:4px 0 4px 15px;margin:14px 0 20px}.composer{border:1px solid #cfdbee;border-radius:11px;padding:14px;margin-top:22px;background:#fbfdff}.composer label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}textarea{width:100%;min-height:112px;resize:vertical;border:0;background:transparent;color:#24364c;outline-offset:1px}input,select{width:100%;padding:10px;border:1px solid #cad6e6;border-radius:7px;color:#24364c;background:white}.composer-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11px;color:var(--muted)}.flow{display:flex;align-items:stretch;gap:8px;margin:20px 0;flex-wrap:wrap}.flow .node{flex:1;min-width:100px;border:1px solid #cedcf1;background:#f4f8ff;padding:12px;border-radius:8px;text-align:center;font-size:12px}.flow .arrow{align-self:center;color:#7391b8}.scope{display:grid;grid-template-columns:1fr 1fr;gap:15px}.scope ul{padding-left:18px;font-size:13px}.tag{font-size:11px;background:#edf1f6;color:#5e7088;padding:3px 7px;border-radius:4px}.screen{border:1px solid #cfdaea;border-radius:9px;overflow:hidden;margin:18px 0}.screenbar{background:#edf2f9;padding:9px 14px;display:flex;justify-content:space-between;font-size:12px}.screenbody{padding:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}.field.full{grid-column:1/-1}.field textarea{border:1px solid #cad6e6;border-radius:7px;padding:10px;min-height:75px}.checks{list-style:none;padding:0;margin:20px 0}.checks li{padding:12px 0;border-bottom:1px solid #e8edf5;display:flex;justify-content:space-between;gap:10px}.checks span{color:#2c725c;font-size:12px}.progress{height:7px;background:#e7edf7;border-radius:9px;margin:20px 0;overflow:hidden}.progress i{display:block;height:100%;background:#3574ef;transition:width .3s}.banner{border:1px solid #bddccd;border-radius:8px;padding:12px 15px;background:#eff9f4;color:#23624a;font-size:13px;margin:16px 0}.alert{border:1px solid #eed5ac;background:#fff7e9;color:#805826;padding:12px;border-radius:8px;font-size:13px}.result{font-size:30px;font-weight:650;color:#1c6a50;margin:6px 0}.ticket{display:flex;gap:14px;justify-content:space-between;border:1px solid #d2e1d8;border-radius:10px;background:#f9fffb;padding:18px;margin:18px 0}.ticket strong{display:block}.ticket small{color:var(--muted)}.timeline{margin:15px 0;padding-left:20px;border-left:2px solid #c7ddda}.timeline p{font-size:13px}.footer-note{font-size:11px;color:var(--muted);margin-top:20px}.paused{margin:20px 32px 0;background:#fff6de;border:1px solid #edd69f;padding:15px;border-radius:10px;display:flex;align-items:center;justify-content:space-between}dialog{border:1px solid var(--line);border-radius:14px;padding:25px;width:min(430px,90vw);color:#24364c}dialog::backdrop{background:#11223b80}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.successmark{width:56px;height:56px;border-radius:50%;background:#dff5eb;color:#1f7855;display:grid;place-items:center;font-size:28px;margin-bottom:18px}svg{width:100%;height:auto}.svgbox{fill:#eff5ff;stroke:#a9bfdc}.svgtext{fill:#243b5b;font:13px 'Segoe UI',sans-serif}.svgarrow{stroke:#7593b6;stroke-width:2;fill:none}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e3eaf2}.scope-choice{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 0}.scope-choice input{width:16px}.saved{font-size:11px;color:var(--muted)}@media(max-width:1080px){.layout{grid-template-columns:minmax(0,1fr) 240px;padding:22px}.shell{grid-template-columns:205px}aside{padding:22px 14px}.hero h1{font-size:33px}}@media(max-width:820px){.shell{display:block}aside{padding:14px 20px;display:block}.journey{display:flex;overflow:auto;gap:8px}.journey li{min-width:132px;padding:7px}.journey small,.sidefoot,aside .eyebrow{display:none}.brand{font-size:17px}.brand .mark{width:30px;height:30px}.layout{grid-template-columns:1fr;padding:20px}.coach{position:static;grid-row:1}.coach .ledger{display:none}.coach .panel{padding:14px}.coach p{margin-bottom:5px}.coach details{display:none}header{height:auto;padding:16px 20px}.prototype{padding:8px 20px}.cards{grid-template-columns:1fr}.cards .mini{padding:12px}.cards .symbol{float:left;margin-right:12px}.hero h1{font-size:32px}.scope{grid-template-columns:1fr}.panel{padding:20px}.toolbar .saved{display:none}.paused{margin:16px 20px 0}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media print{aside,.coach,.toolbar,.actions,.composer-footer{display:none}.shell,.layout{display:block}.prototype{display:block}.panel{break-inside:avoid}}
</style></head>
<body><div id="app"></div><dialog id="restart-dialog" aria-labelledby="restart-title"><h2 id="restart-title">Start a fresh demo?</h2><p>This resets only the simulated progress and sample request stored in this browser. No real application is affected.</p><div class="actions"><button class="btn" id="keep-demo">Keep my progress</button><button class="btn primary" id="confirm-restart">Restart demo</button></div></dialog>
<script>
(()=>{'use strict';
const key='pl-guided-demo-v1';const initial=()=>({step:0,paused:false,busy:false,progress:0,idea:'Build an internal service-request app. Employees can submit requests and track progress. Managers can assign requests and update status. Use synthetic data in the demo environment.',scope:{assignment:true,history:true},request:{title:'Meeting-room projector is not working',category:'Facilities',priority:'Normal',description:'The projector in the sample meeting room does not display an image.'},role:'Employee',status:'Not submitted',error:''});
let state=initial(),timer;try{const old=JSON.parse(localStorage.getItem(key));if(old&&Number.isInteger(old.step)&&old.step>=0&&old.step<=9)state={...initial(),...old,busy:false,request:{...initial().request,...old.request},scope:{...initial().scope,...old.scope}};}catch{}
const stages=['Start','Discover','Shape','Design','Build & test','Deploy','Use in EAL','Submit a request','Manage request','Complete'];
const groups=[['Discover','Understand the app'],['Design','Shape the experience'],['Build & test','Create the demo'],['Deploy','Verify the handoff'],['Operate','Use the application']];
const group=()=>state.step<=2?0:state.step===3?1:state.step===4?2:state.step<=5?3:4;
const titles=['Build your first app','Begin with a business idea','A focused first release','See what you’re about to build','From plan to demo application','Deploy to the demo environment','Your application. Now in action.','Submit your first service request','Follow the request to resolution','You’ve completed the full journey'];
const coach=[['One journey, two experiences','First, build the app in PL. Then use it through EAL. Every operation here is a simulation.','Start the guided demo to begin.'],['Start with ordinary language','The example is already in the chat box. Edit it if you like, then send it. No technical vocabulary is required.','Click “Send idea”.'],['Make the scope explicit','This example has two roles and a small set of capabilities. You can toggle optional features before continuing.','Review the scope, then confirm.'],['Review before building','The screen and architecture are proposed designs. The preview is not yet a deployed application.','Review the design and continue.'],['Watch real product states—simulated here','A real PL implementation would wait for build and test evidence. This prototype demonstrates those states with sample results.','Start the simulated build.'],['A deliberate deployment decision','Only the demo environment is available. After the simulated health check, the guide will automatically open EAL.','Click “Deploy demo”.'],['The guide follows you','You are now in the EAL part of the same demo. The app, version and environment remain visible.','Send the prefilled operational prompt.'],['Review the sample data','We filled the form with synthetic data. Change it if you wish. Nothing is submitted until you click the button.','Click “Submit request”.'],['Try the manager experience','The role switch is a simulation, not a permission grant. Switch roles, assign the request, then resolve it.','Follow the highlighted action.'],['You learned the complete cycle','You moved from an idea to a simulated application, then completed an operational request.','Replay the demo or save a summary.']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(key,JSON.stringify({...state,busy:false}));}catch{}}
function btn(label,action,primary=true){return `<button class="btn ${primary?'primary highlight':''}" data-action="${action}" ${state.paused||state.busy?'disabled':''}>${label}</button>`;}
function flow(nodes){return `<div class="flow" aria-label="Process flow">${nodes.map((n,i)=>`${i?'<span class="arrow" aria-hidden="true">→</span>':''}<div class="node">${n}</div>`).join('')}</div>`;}
function composer(value,label,action){return `<div class="composer"><label for="prompt">${label} · suggested prompt, editable</label><textarea id="prompt" ${state.paused?'disabled':''}>${esc(value)}</textarea><div class="composer-footer"><span>You review. The guide helps.</span>${btn(action==='idea'?'Send idea':'Send to EAL',action)}</div></div>`;}
function view(){switch(state.step){
case 0:return `<div class="hero"><div class="icon" aria-hidden="true">✦</div><div class="eyebrow" style="margin-top:20px">Your first application, guided</div><h1>From “I have an idea”<br>to “it works.”</h1><p>Build a Service Request Hub, deploy it to a demo workspace, then use it to complete a business task. We’ll guide every step.</p><div class="actions">${btn('Start guided demo →','next')}</div><div class="cards"><div class="mini"><div class="symbol">01</div><h3>Build with PL</h3><p>Discover, design and review a first release.</p></div><div class="mini"><div class="symbol">02</div><h3>Deploy the demo</h3><p>See the checks and the handoff.</p></div><div class="mini"><div class="symbol">03</div><h3>Use it in EAL</h3><p>Create, assign and resolve a sample request.</p></div></div><p class="footer-note">No account, credentials or external systems needed. Progress stays in this browser.</p></div>`;
case 1:return `<div class="assistant-message"><h3>Let’s organize employee requests.</h3><p>A shared workspace gives employees visibility and managers a queue to act on. I’ve prepared an example request below.</p></div>${flow(['Employee submits','Manager reviews','Request resolved'])}${composer(state.idea,'Describe the app','idea')}<p class="footer-note">This guided example uses a fixed sample app. Your edits are retained in the brief; they do not generate new code in this prototype.</p>`;
case 2:return `<div class="bubble">${esc(state.idea)}</div><div class="assistant-message"><h3>Here is the proposed first release.</h3><p>Employees submit and track their own requests. A manager sees the team queue and resolves requests.</p></div><div class="scope"><div class="mini"><h3>Included</h3><p>Create request · My requests · Team queue · Resolve request</p><label class="scope-choice"><input id="assignment" type="checkbox" ${state.scope.assignment?'checked':''} ${state.paused?'disabled':''}> Manager assignment</label><label class="scope-choice"><input id="history" type="checkbox" ${state.scope.history?'checked':''} ${state.paused?'disabled':''}> Visible status history</label></div><div class="mini"><h3>Outside this demo</h3><p>External integrations, real employee data, production deployment, billing and mobile apps.</p><p><span class="tag">Demo choice</span> Internal users and synthetic data</p></div></div><div class="actions">${btn('Confirm demo scope →','scope')}</div>`;
case 3:return `<p class="muted">Draft design · Service Request Hub</p><div class="screen"><div class="screenbar"><strong>Service Request Hub</strong><span>Employee view</span></div><div class="screenbody"><h3>My requests</h3><p class="muted">A clear view of what you’ve submitted and what happens next.</p><table><thead><tr><th>Request</th><th>Category</th><th>Status</th></tr></thead><tbody><tr><td>Meeting-room projector</td><td>Facilities</td><td><span class="badge">Open</span></td></tr><tr><td>Sample access request</td><td>IT</td><td><span class="badge green">Resolved</span></td></tr></tbody></table></div></div><h3>Proposed logical architecture</h3><svg viewBox="0 0 650 105" role="img" aria-label="Browser interface connects to application operations, which connect to application data"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#7593b6"/></marker></defs><rect class="svgbox" x="2" y="20" rx="8" width="170" height="65"/><rect class="svgbox" x="240" y="20" rx="8" width="170" height="65"/><rect class="svgbox" x="478" y="20" rx="8" width="170" height="65"/><path class="svgarrow" marker-end="url(#arrow)" d="M172 52H233 M410 52H471"/><text class="svgtext" x="87" y="57" text-anchor="middle">Browser interface</text><text class="svgtext" x="325" y="57" text-anchor="middle">App operations</text><text class="svgtext" x="563" y="57" text-anchor="middle">Application data</text></svg><p class="footer-note">Design example only. APIs, database and deployment are simulated.</p><div class="actions">${btn('Accept demo design →','next')}</div>`;
case 4:{const labels=['Prepare application screens','Configure role and data rules','Run sample acceptance checks','Package demo version 1.0'];return `<p>PL turns the reviewed plan into a testable application. The progress below is a scripted demonstration.</p><div class="progress" role="progressbar" aria-label="Simulated build progress" aria-valuemin="0" aria-valuemax="4" aria-valuenow="${state.progress}"><i style="width:${state.progress*25}%"></i></div><ul class="checks">${labels.map((l,i)=>`<li>${l}<span>${i<state.progress?'✓ Simulated pass':state.busy&&i===state.progress?'In progress…':'Waiting'}</span></li>`).join('')}</ul><div class="actions">${btn(state.busy?'Building demo…':'Start simulated build','build')}</div><p class="footer-note">No source generation or real tests run in this HTML prototype.</p>`;}
case 5:return `<div class="banner">✓ Simulated build complete · Four sample checks passed</div><h3>Review the demo deployment</h3><div class="mini"><p><strong>Application:</strong> Service Request Hub</p><p><strong>Version:</strong> Demo 1.0</p><p><strong>Target:</strong> Isolated demo workspace</p><p><strong>Data:</strong> Synthetic only</p></div><ul class="checks"><li>Deployment status<span>${state.busy?'Simulating deployment…':'Ready for your action'}</span></li><li>EAL handoff<span>${state.busy?'Waiting for simulated health check':'Opens automatically after verification'}</span></li></ul><div class="actions">${btn(state.busy?'Deploying demo…':'Deploy demo →','deploy')}</div>`;
case 6:return `<div class="banner">✓ Demo deployment verified · EAL opened automatically</div><div class="stage-logo">EAL · Operational workspace</div><h2>Let’s use the app you just delivered.</h2><p>Start as an employee. Ask for help submitting a facilities request; the guide will prepare the form.</p>${flow(['Ask EAL','Review sample form','Create request'])}${composer(state.operationalPrompt||'Help me submit a facilities request for a meeting-room projector that is not working.','Try the operational assistant','operate')}`;
case 7:return `<div class="assistant-message"><h3>I’ve prepared a sample request.</h3><p>Review the information below. You can edit any field before submitting.</p></div><div class="screen"><div class="screenbar"><strong>New service request</strong><span class="tag">Synthetic data</span></div><form id="request-form" class="screenbody"><div class="fields"><div class="field full"><label for="request-title">Request title</label><input id="request-title" required maxlength="120" value="${esc(state.request.title)}" ${state.paused?'disabled':''}></div><div class="field"><label for="category">Category</label><select id="category" ${state.paused?'disabled':''}>${['Facilities','IT','General'].map(x=>`<option ${x===state.request.category?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="priority">Priority</label><select id="priority" ${state.paused?'disabled':''}>${['Low','Normal','High'].map(x=>`<option ${x===state.request.priority?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label for="description">Description</label><textarea id="description" required maxlength="1000" ${state.paused?'disabled':''}>${esc(state.request.description)}</textarea></div></div><div class="actions"><button class="btn primary highlight" type="submit" ${state.paused?'disabled':''}>Submit request</button></div></form></div><p class="footer-note">Creates one simulated request in this browser, not in a live application.</p>`;
case 8:return `<div class="banner">✓ Sample request created · DEMO-001</div><div class="ticket"><div><strong>${esc(state.request.title)}</strong><small>${esc(state.request.category)} · ${esc(state.request.priority)} priority · Demo employee</small></div><span class="badge ${state.status==='Resolved'?'green':''}">${esc(state.status)}</span></div><p>${esc(state.request.description)}</p><div class="mini"><h3>Current demo role: ${state.role}</h3><p>${state.role==='Employee'?'Employees can view their own request. Try the manager role to continue the operational journey.':'Managers can act on the team queue. This demo role does not grant permissions in any real system.'}</p></div>${state.scope.history?`<div class="timeline"><p>✓ Request submitted by demo employee</p>${state.status!=='Open'?'<p>✓ Assigned to Demo '+esc(state.request.category)+' Team</p>':''}</div>`:''}<div class="actions">${state.role==='Employee'?btn('Switch to demo manager →','role'):state.scope.assignment&&state.status==='Open'?btn('Assign to '+esc(state.request.category)+' Team','assign'):btn('Mark resolved →','resolve')}</div>`;
case 9:return `<div class="successmark" aria-hidden="true">✓</div><div class="eyebrow">Guided demo complete</div><h2>You built it. Then you used it.</h2><p>You went from an application idea to a simulated deployment, then completed a service request through EAL.</p><div class="cards"><div class="mini"><h3>Defined</h3><p>Scope, users and a reviewed design.</p></div><div class="mini"><h3>Delivered</h3><p>Simulated build, checks and deployment.</p></div><div class="mini"><h3>Operated</h3><p>Request DEMO-001 resolved.</p></div></div><div class="ticket"><div><strong>${esc(state.request.title)}</strong><small>Demo 1.0 · Synthetic request</small></div><span class="badge green">Resolved</span></div><div class="actions">${btn('Download demo summary','download')}${btn('Replay the journey','restart',false)}</div><div class="mini" style="margin-top:24px"><h3>Ready for your own application?</h3><p>In the live platform, this is where you would start your own project or customize this example. Those services are not connected to this prototype.</p></div>`;
}}
function render(){save();const g=group(),c=[...coach[state.step]];if(state.paused)c[2]='Click Continue demo to resume.';if(state.step===8&&!state.scope.assignment)c[1]='Switch to the simulated manager role, then resolve the request. Assignment was excluded from your demo scope.';document.getElementById('app').innerHTML=`<div class="shell"><aside><div class="brand"><span class="mark">PL</span>PL Studio</div><div><div class="eyebrow">Your guided journey</div><ol class="journey">${groups.map((x,i)=>`<li class="${state.step===9||i<g?'done':i===g?'active':''}" ${i===g?'aria-current="step"':''}><span class="num">${state.step===9||i<g?'✓':i+1}</span><div>${x[0]}<small>${x[1]}</small></div></li>`).join('')}</ol></div><div class="sidefoot"><span class="stage-logo">${state.step>=6?'EAL · Use the app':'PL · Deliver the app'}</span><strong>Service Request Hub</strong>Demo 1.0 · Local sample<br>No production connection</div></aside><div class="main"><header><div><strong>${state.step>=6?'EAL workspace':'Application delivery'}</strong><p>Service Request Hub · Guided demo</p></div><div class="toolbar"><span class="saved">Progress saved in this browser</span><button class="btn small" data-action="pause">${state.paused?'Resume':'Pause'}</button><button class="btn text small" data-action="restart">Restart</button></div></header><div class="prototype"><strong>Interactive prototype</strong> · Build, deployment, roles and business actions are simulated. No external services are called.</div>${state.paused?'<div class="paused"><span><strong>Demo paused.</strong> Your progress and edits are saved.</span><button class="btn primary" data-action="pause">Continue demo</button></div>':''}<div class="layout"><main class="workspace" id="main-content"><div class="stagehead"><div><div class="eyebrow">${state.step===0?'Welcome':`Step ${state.step} of 9 · ${stages[state.step]}`}</div>${state.step?`<h1 tabindex="-1" id="stage-title">${titles[state.step]}</h1>`:''}</div><span class="badge ${state.step>=6?'green':''}">${state.step>=6?'EAL':'PL'}</span></div><section class="panel">${view()}${state.error?`<p class="alert" role="alert">${esc(state.error)}</p>`:''}</section><p class="footer-note">You can pause at any point and return here. This browser stores only demo progress and the sample data you enter.</p></main><section class="coach" aria-label="Guide"><div class="panel"><div class="coach-label">Your guide</div><h2>${c[0]}</h2><p>${c[1]}</p><div class="bubble"><strong>Next action</strong><br>${c[2]}</div><details><summary>Why this step?</summary><p>Each step teaches one part of delivery or operation. In a live implementation, completion is driven by verified system state and your permissions.</p></details></div><div class="panel ledger"><h3>Our understanding</h3><dl><dt>Goal</dt><dd>Make employee requests visible and actionable.</dd><dt>${state.step>=2?'Confirmed demo scope':'Suggested scope'}</dt><dd>Internal service requests · Employee and manager roles</dd><dt>Choices</dt><dd>${state.scope.assignment?'Manager assignment':'Direct resolution'} · ${state.scope.history?'Status history':'Simple current status'}</dd><dt>Environment</dt><dd>Demo only · Synthetic data</dd><dt>Current result</dt><dd>${state.step>=8?'DEMO-001 · '+state.status:state.step>=6?'Simulated app available in EAL':state.step>=5?'Sample build checks passed':'Draft example'}</dd></dl></div></section></div></div></div>`;bind();}
function next(){state.error='';state.step=Math.min(9,state.step+1);render();document.getElementById('stage-title')?.focus();}
function run(kind){if(state.busy||state.paused)return;state.busy=true;state.progress=0;render();const limit=kind==='build'?4:2;function tick(){if(state.paused){timer=setTimeout(tick,300);return;}state.progress++;if(state.progress>=limit){state.busy=false;state.progress=0;next();return;}render();timer=setTimeout(tick,700);}timer=setTimeout(tick,700);}
function capture(){const p=document.getElementById('prompt');if(p){if(state.step===1)state.idea=p.value;else state.operationalPrompt=p.value;}if(state.step===2){state.scope.assignment=document.getElementById('assignment').checked;state.scope.history=document.getElementById('history').checked;}if(state.step===7){state.request={title:document.getElementById('request-title').value,category:document.getElementById('category').value,priority:document.getElementById('priority').value,description:document.getElementById('description').value};}save();}
function act(action){if(action==='restart'){document.getElementById('restart-dialog').showModal();return;}if(action==='pause'){capture();state.paused=!state.paused;render();return;}if(state.paused||state.busy)return;capture();if(action==='idea'||action==='operate'){if(!(action==='idea'?state.idea:state.operationalPrompt)?.trim()){state.error='Enter a prompt or use the suggested example.';render();return;}next();}else if(action==='next'||action==='scope')next();else if(action==='build'||action==='deploy')run(action);else if(action==='role'){state.role='Manager';render();}else if(action==='assign'){state.status='In progress';render();}else if(action==='resolve'){state.status='Resolved';next();}else if(action==='download'){const text=['GUIDED DEMO SUMMARY — SIMULATED ONLY','Application: Service Request Hub','Demo version: 1.0','Brief: '+state.idea,'Manager assignment: '+state.scope.assignment,'Status history: '+state.scope.history,'Request: DEMO-001',state.request.title,'Status: Resolved','No real build, deployment, tests or business operations were performed.'].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download='guided-demo-summary.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}}
function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.action)));document.querySelectorAll('input,textarea,select').forEach(e=>e.addEventListener('input',capture));document.getElementById('request-form')?.addEventListener('submit',e=>{e.preventDefault();if(state.paused)return;capture();if(!state.request.title.trim()||!state.request.description.trim()){state.error='Add a title and description before submitting.';render();return;}state.status='Open';next();});}
document.getElementById('keep-demo').onclick=()=>document.getElementById('restart-dialog').close();document.getElementById('confirm-restart').onclick=()=>{clearTimeout(timer);state=initial();document.getElementById('restart-dialog').close();render();window.scrollTo(0,0);};render();
})();
</script></body></html>
